
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyBuddy | Login</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            color: #f8fafc;
            background:
                radial-gradient(ellipse at top right, #202b50, transparent 55%),
                #0b1020;
        }

        .auth-card {
            width: 100%;
            max-width: 420px;
            padding: 36px;
            border: 1px solid #29334b;
            border-radius: 20px;
            background: rgba(17, 24, 43, 0.96);
            box-shadow: 0 24px 70px rgba(0, 0, 0, 0.3);
        }

        .logo {
            margin: 0 0 8px;
            font-size: 29px;
            font-weight: bold;
        }

        .logo span {
            color: #818cf8;
        }

        .subtitle {
            margin: 0 0 28px;
            color: #9ca9c2;
            line-height: 1.6;
        }

        .tabs {
            display: flex;
            gap: 8px;
            padding: 5px;
            margin-bottom: 25px;
            border-radius: 10px;
            background: #0b1020;
        }

        .tabs button {
            flex: 1;
            padding: 11px;
            border: 0;
            border-radius: 8px;
            background: transparent;
            color: #aab4ca;
            font-size: 14px;
            cursor: pointer;
        }

        .tabs button.active {
            background: #6366f1;
            color: white;
        }

        label {
            display: block;
            margin: 16px 0 8px;
            color: #dbe3f3;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #303b55;
            border-radius: 9px;
            outline: none;
            background: #0d1426;
            color: white;
            font-size: 15px;
        }

        input:focus {
            border-color: #818cf8;
            box-shadow: 0 0 0 3px rgba(129, 140, 248, 0.12);
        }

        .submit-btn {
            width: 100%;
            margin-top: 24px;
            padding: 14px;
            border: 0;
            border-radius: 9px;
            background: linear-gradient(100deg, #6366f1, #8b5cf6);
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .submit-btn:hover {
            filter: brightness(1.12);
        }

        .message {
            min-height: 20px;
            margin-top: 16px;
            color: #a5b4fc;
            font-size: 13px;
            line-height: 1.5;
        }

        .back-link {
            display: block;
            margin-top: 20px;
            text-align: center;
            color: #a5b4fc;
            font-size: 14px;
            text-decoration: none;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .demo-note {
            margin-top: 22px;
            color: #8491aa;
            font-size: 12px;
            line-height: 1.5;
            text-align: center;
        }

        @media (max-width: 420px) {
            .auth-card {
                padding: 25px 20px;
            }
        }
    </style>
</head>
<body>
    <main class="auth-card">
        <h1 class="logo">StudyBuddy<span>.</span></h1>
        <p class="subtitle">Your goals. Your growth. Your personal study space.</p>

        <div class="tabs">
            <button type="button" id="loginTab" class="active">Login</button>
            <button type="button" id="signupTab">Sign Up</button>
        </div>

        <form id="authForm">
            <div id="nameField" hidden>
                <label for="fullName">Full Name</label>
                <input id="fullName" type="text"
                       placeholder="Enter your name" autocomplete="name">
            </div>

            <label for="email">Email Address</label>
            <input id="email" type="email"
                   placeholder="you@example.com" autocomplete="email" required>

            <label for="password">Password</label>
            <input id="password" type="password"
                   placeholder="Enter password" minlength="6"
                   autocomplete="current-password" required>

            <button class="submit-btn" id="submitBtn" type="submit">
                Login to StudyBuddy
            </button>

            <p class="message" id="message" aria-live="polite"></p>
        </form>

        <a class="back-link" href="index.html">← Back to Dashboard</a>

        <p class="demo-note">
            Demo interface only. Real accounts and secure authentication
            are not connected yet. Do not enter a real password.
        </p>
    </main>

    <script>
        const loginTab = document.getElementById("loginTab");
        const signupTab = document.getElementById("signupTab");
        const nameField = document.getElementById("nameField");
        const fullName = document.getElementById("fullName");
        const password = document.getElementById("password");
        const submitBtn = document.getElementById("submitBtn");
        const message = document.getElementById("message");
        const authForm = document.getElementById("authForm");

        let mode = "login";

        function setMode(newMode) {
            mode = newMode;
            const isSignup = mode === "signup";

            loginTab.classList.toggle("active", !isSignup);
            signupTab.classList.toggle("active", isSignup);
            nameField.hidden = !isSignup;
            fullName.required = isSignup;
            password.autocomplete = isSignup
                ? "new-password"
                : "current-password";
            submitBtn.textContent = isSignup
                ? "Create Demo Account"
                : "Login to StudyBuddy";
            message.textContent = "";
        }

        loginTab.addEventListener("click", () => setMode("login"));
        signupTab.addEventListener("click", () => setMode("signup"));

        authForm.addEventListener("submit", event => {
            event.preventDefault();
            message.textContent = mode === "signup"
                ? "Demo only: account creation is not connected yet."
                : "Demo only: login is not connected yet.";
        });
    </script>
</body>
</html>
